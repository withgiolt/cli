name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  # A tag that doesn't match gleam.toml would publish the wrong version
  # under the right name, or the other way round.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag matches the package version
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" gleam.toml
      # Only main is protected by a pull request with passing CI, so a tag
      # on any other commit would publish code that skipped both.
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish-hex:
    needs: check-version
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"

      - name: Cache Gleam build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-gleam-build-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: ${{ runner.os }}-gleam-build-

      - name: Install dependencies
        run: gleam deps download

      - name: Publish to Hex
        run: just publish-hex
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  publish-npm:
    needs: check-version
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: gleam deps download

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          just build-npm
          npm publish ./dist
