name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-hex:
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"

      - name: Cache Gleam build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-gleam-build-${{ hashFiles('manifest.toml', 'gleam.toml') }}
          restore-keys: ${{ runner.os }}-gleam-build-

      - name: Install dependencies
        run: gleam deps download

      - name: Publish to Hex
        run: just publish-hex
        env:
          HEXPM_API_KEY: ${{ secrets.HEXPM_API_KEY }}

  publish-npm:
    environment: Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: gleam deps download

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          just build-npm
          npm publish ./dist
